version: '3.8'

services:
  citation-binder:
    build: .
    container_name: citation-binder
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - LLM_PROVIDER=gemini
      - ALLOW_HEURISTIC_FALLBACK=true
      # Provide your API key below or via your host .env file:
      # - GEMINI_API_KEY=${GEMINI_API_KEY}
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
